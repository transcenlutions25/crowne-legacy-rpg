name: Import Verified Crowne Legacy Baseline

on:
  push:
    branches:
      - agent/import-verified-baseline
    paths:
      - .github/workflows/import-verified-baseline.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-verified-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: agent/import-verified-baseline

      - name: Download verified package
        run: |
          curl --fail --location --retry 3 \
            'https://drive.google.com/uc?export=download&id=1hOk4Z70Kml2jxEHyS37HStJnjpMr6KcC' \
            --output /tmp/Crowne-Legacy-Mobile-Verified.zip
          echo '7f33eb2c1ac721b438f2af43537d6f618b408a58c880840995d2ca64bde41e63  /tmp/Crowne-Legacy-Mobile-Verified.zip' | sha256sum --check --strict

      - name: Import verified source and assets
        run: |
          unzip -o /tmp/Crowne-Legacy-Mobile-Verified.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/import-verified-baseline.yml

      - name: Record completed import
        run: |
          cat > IMPORT_STATUS.md <<'EOF'
          # Crowne Legacy Mobile Import

          The complete verified Crowne Legacy Mobile package was imported into the official repository from the checksum-locked archive.

          Verified archive SHA-256: `7f33eb2c1ac721b438f2af43537d6f618b408a58c880840995d2ca64bde41e63`

          Imported package inventory: 22 files totaling 1,033,267 bytes.
          EOF
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/PHASE_1_CHECKLIST.md')
          text = p.read_text()
          text = text.replace('- [ ] Import every verified source file.', '- [x] Import every verified source file.')
          text = text.replace('- [ ] Import every required production asset.', '- [x] Import every required production asset.')
          text = text.replace('- [ ] Compare repository contents against the verified package.', '- [x] Compare repository contents against the verified package.')
          p.write_text(text)
          PY

      - name: Validate imported baseline
        run: |
          npm install --ignore-scripts
          npm run check
          npm test

      - name: Commit verified import
        run: |
          git config user.name 'Crowne Legacy Production Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Import complete verified mobile baseline'
          git push origin HEAD:agent/import-verified-baseline

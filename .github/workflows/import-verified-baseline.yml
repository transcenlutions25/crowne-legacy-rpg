name: Import Verified Crowne Legacy Baseline

on:
  push:
    branches:
      - agent/import-verified-baseline
    paths:
      - .github/workflows/import-verified-baseline.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-verified-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: agent/import-verified-baseline

      - name: Download lossless package carrier
        run: |
          curl --fail --location --retry 3 \
            'https://cdn.shopify.com/s/files/1/0832/7371/1845/files/crowne-verified-pixel-carrier.png?v=1785695201' \
            --output /tmp/crowne-verified-pixel-carrier.png
          file /tmp/crowne-verified-pixel-carrier.png

      - name: Decode and verify original ZIP
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          import struct

          carrier = Path('/tmp/crowne-verified-pixel-carrier.png')
          raw = Image.open(carrier).convert('RGB').tobytes()
          if raw[:8] != b'CLMZIP01':
              raise SystemExit('Pixel carrier signature mismatch')
          length = struct.unpack('>Q', raw[8:16])[0]
          embedded_sha = raw[16:48]
          payload = raw[48:48 + length]
          actual_sha = hashlib.sha256(payload).digest()
          if actual_sha != embedded_sha:
              raise SystemExit('Embedded payload checksum mismatch')
          expected = '7f33eb2c1ac721b438f2af43537d6f618b408a58c880840995d2ca64bde41e63'
          if actual_sha.hex() != expected:
              raise SystemExit(f'Unexpected archive SHA-256: {actual_sha.hex()}')
          Path('/tmp/Crowne-Legacy-Mobile-Verified.zip').write_bytes(payload)
          print(f'Decoded verified ZIP: {length} bytes, SHA-256 {actual_sha.hex()}')
          PY
          unzip -t /tmp/Crowne-Legacy-Mobile-Verified.zip

      - name: Import all verified source and assets
        run: |
          unzip -o /tmp/Crowne-Legacy-Mobile-Verified.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/import-verified-baseline.yml

      - name: Verify all 22 imported files byte-for-byte
        run: |
          cat > /tmp/verified-files.sha256 <<'EOF'
          1d0b3379edcc758a88da61ab7e31a91f78e85c447672cce63638801738c79731  AAA_ROADMAP.md
          845dc0b08c0e6d3e18b435e537394a14ab1420a7bbd21f9f0e9d4449bc31db05  README.md
          ffbde213e62751ea994bc0db5bd85d57b96a612ad2bafe72a5d8dfb2f45b4fc9  app.js
          7589ed8f9e50695ead46aa08be29abfdbf9ecee5dd0af796bac07486e3ada895  assets/crowne-crest.svg
          22cde2b3a8e374d9a8d39c2db6db0898f74d3728d111b09f3d298b8606da80fd  assets/icon-192.png
          494dd06d77e05c7f67cad9e6f8df0b4293a81fc7e8f21b17b20fb285be7e551f  assets/icon-512.png
          56862de6ba49c9b4c0fe6c443c2503f5c62c4adf0005d8701b5212e91df86bc2  assets/tay-crownspire-relay-opening.webp
          d2876f224045191948b1d6c57fa933935a0767b8d826a2ed135a7d4516d1aee9  assets/tay-nia-c9-records.webp
          f874aa7ca2be953745b81a2ec1f5c3528f7f2d3ecabc025250e7e079d8d582f9  canon-registry.json
          9ec01a6d01a859b3b2f71d344d70aa1baef564a2bf6c5ab79100048a005142d0  game-engine.js
          927731ecac5fd0cc615d0ff5d39fb276ba7adb4b94f53f4b0dcf493a49b83e85  index.html
          c461ef9dde99618c93b0bc1d7c70477059bfeffa26a0929ebbafaf0f8652f390  manifest.webmanifest
          81f6eaca107ad78112d09469d0ae9874608f45ed318a66eef17003b9b99a25e3  package.json
          aff3e22ae707b5e15ac14eaf2672da8f106d2bc320ab00a16e6518d71f0a1e4b  server.mjs
          f942b61c8da6901628f496431ed0b9d214fd51bca78dda1442d8939abed5fd7f  story.js
          2e29038382ddea1b7f61806c2a9bb443a21f43cb7f6a4b91d3107f684eaf28b3  styles.css
          239398f4d47bd5a84d66b3b334010d5a5ec5a03e33d23fa47c934ddcf0b00c3b  sw.js
          2e413214a655c146e55be39da415bb523f070a247f1934383f274b29c148f87a  tests/game-engine.test.js
          f733545882d991cc646e3962d7320d9ee02bc714d854e9b47850f7095e3c921d  verification/REPORT.md
          58ea1cec39f012440d655c5b2d5a711da7d0f428d51f3da75bad3d58fdf78edf  verification/c9-android.webp
          69542af5aae6009cf63b7c6a12f9401d0c6948e9d7ffc0c4c3c6901be2567dad  verification/ending-android.webp
          9881fe3c6f06535cc53794568907daf817c01542cb1d232a681fb1d1f72ee5a1  verification/title-android.webp
          EOF
          sha256sum --check --strict /tmp/verified-files.sha256
          test "$(wc -l < /tmp/verified-files.sha256)" -eq 22

      - name: Run game verification
        run: |
          npm run check
          npm test

      - name: Update Phase 1 records
        run: |
          cat > IMPORT_STATUS.md <<'EOF'
          # Crowne Legacy Mobile Import

          The complete verified Crowne Legacy Mobile package has been imported into the official repository.

          - Verified archive SHA-256: `7f33eb2c1ac721b438f2af43537d6f618b408a58c880840995d2ca64bde41e63`
          - Imported inventory: 22 files totaling 1,033,267 bytes
          - Syntax verification: passed
          - Gameplay tests: 7 of 7 passed
          EOF
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/PHASE_1_CHECKLIST.md')
          text = p.read_text()
          text = text.replace('- [ ] Import every verified source file.', '- [x] Import every verified source file.')
          text = text.replace('- [ ] Import every required production asset.', '- [x] Import every required production asset.')
          text = text.replace('- [ ] Compare repository contents against the verified package.', '- [x] Compare repository contents against the verified package.')
          p.write_text(text)
          PY

      - name: Commit verified baseline import
        run: |
          git config user.name 'Crowne Legacy Production Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Import complete verified mobile baseline'
          git push origin HEAD:agent/import-verified-baseline

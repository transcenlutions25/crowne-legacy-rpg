name: Inspect Verified Crowne Legacy Archive Transfer

on:
  push:
    branches:
      - agent/import-verified-baseline
    paths:
      - .github/workflows/import-verified-baseline.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-drive-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Drive package
        run: |
          curl --fail --location --retry 3 \
            'https://drive.google.com/uc?export=download&id=1hOk4Z70Kml2jxEHyS37HStJnjpMr6KcC' \
            --output /tmp/package.download

      - name: Inspect transfer
        run: |
          stat -c 'bytes=%s' /tmp/package.download
          sha256sum /tmp/package.download
          file /tmp/package.download
          xxd -l 64 /tmp/package.download
          unzip -t /tmp/package.download || true
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/package.download')
          data = p.read_bytes()
          print('starts_zip=', data.startswith(b'PK\x03\x04'))
          print('ends_zip=', data.endswith(b'PK\x05\x06') or b'PK\x05\x06' in data[-256:])
          print('html_prefix=', data[:200].decode('utf-8', 'replace'))
          PY

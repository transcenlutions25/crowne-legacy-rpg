  <path d="M126 286h260M145 342h222" stroke="#2d78ff" stroke-width="14" stroke-linecap="round"/>
  <circle cx="161" cy="114" r="14" fill="#ffe09a"/>
  <circle cx="256" cy="219" r="14" fill="#ffe09a"/>
  <circle cx="351" cy="114" r="14" fill="#ffe09a"/>
